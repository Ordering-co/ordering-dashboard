    <style>
      /* First paint until the app mounts: no white flash */
      .od-boot { position: fixed; inset: 0; z-index: 2147483000; display: flex; align-items: center; justify-content: center; background: #FFFFFF; }
      .od-boot__inner { display: flex; flex-direction: column; align-items: center; gap: 20px; opacity: 0; animation: od-boot-in 240ms ease-out 140ms forwards; }
      .od-boot__inner--static { animation: none; opacity: 1; }
      .od-boot__logo { width: 40px; height: 40px; display: none; }
      .od-boot--brand .od-boot__logo { display: block; }
      .od-boot__bar { position: relative; width: 120px; height: 3px; overflow: hidden; border-radius: 999px; background: #DEE0E3; }
      .od-boot__bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: inherit; background: #266DF0; animation: od-boot-bar 1.1s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
      .od-boot__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @media (prefers-color-scheme: dark) {
        .od-boot--auto { background: #0B0C0D; }
        .od-boot--auto .od-boot__bar { background: #34363A; }
      }
      @media (prefers-reduced-motion: reduce) {
        .od-boot__inner { animation: none; opacity: 1; }
        .od-boot__bar::after { animation: none; width: 100%; opacity: 0.5; }
      }
      @keyframes od-boot-in { to { opacity: 1; } }
      @keyframes od-boot-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>

    <script>
      (function () {
        try {
          var url = new URL(window.location.href);
          var token = url.searchParams.get("token");
          if (!token) return;
          window.__ORDERING_AUTOLOGIN__ = {
            token: token,
            project: url.searchParams.get("project"),
          };
          url.searchParams.delete("token");
          history.replaceState(
            history.state,
            "",
            url.pathname + url.search + url.hash
          );
        } catch (e) {}
      })();
    </script>

    <script>
      // Ordering.co mark on Ordering.co hosts only (white-label hosts get the bar);
      // follow the OS color scheme when nobody is signed in, like the login does
      (function () {
        var boot = document.getElementById('od-boot')
        if (!boot) return
        var host = location.hostname.toLowerCase()
        var official = /^(dashboard|dashboardcf)\.(ordering\.co|orderingplus\.com|tryordering\.com)$/.test(host) || host === 'localhost' || host === '127.0.0.1'
        if (official) boot.className += ' od-boot--brand'
        var token = null
        try { token = window.localStorage.getItem('token') } catch (e) {}
        if (!token) boot.className += ' od-boot--auto'
      })()
    </script>
